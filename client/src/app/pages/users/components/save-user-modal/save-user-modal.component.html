<h2 mat-dialog-title>Cambiar rol</h2>

<mat-dialog-content>
  <p class="dialog-message">
    Usuario: <strong>{{ data.user.name }}</strong>
    <span class="email">({{ data.user.email }})</span>
  </p>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Rol</mat-label>
    <mat-select [formControl]="role">
      @for (option of options; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
    <mat-hint>{{ selectedDescription() }}</mat-hint>
  </mat-form-field>

  <p class="role-warning">
    <mat-icon>info</mat-icon>
    <span>
      Los cambios de rol se aplican de inmediato: el backend vuelve a leer el rol en cada petición.
    </span>
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button
    mat-flat-button
    type="button"
    [disabled]="role.value === data.user.role"
    (click)="confirm()"
  >
    Guardar rol
  </button>
</mat-dialog-actions>
