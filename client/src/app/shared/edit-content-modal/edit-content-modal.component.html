<h2 mat-dialog-title>Editar contenido</h2>

<form (submit)="save($event)">
  <mat-dialog-content class="dialog-content">
    <p class="dialog-message">
      <mat-icon aria-hidden="true">description</mat-icon>
      <span>
        Archivo: <strong>{{ data.fileName }}</strong>
      </span>
    </p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contenido</mat-label>
      <textarea matInput rows="16" class="content-input" [formControl]="content"></textarea>
      <mat-hint align="end">{{ sizeLabel() }} de 5 MB</mat-hint>
      @if (tooLarge()) {
        <mat-error>El contenido supera el límite de 5 MB.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="tooLarge()">Guardar contenido</button>
  </mat-dialog-actions>
</form>
